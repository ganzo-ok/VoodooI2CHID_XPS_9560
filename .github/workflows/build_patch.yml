name: Compila VoodooI2CHID XPS 9560

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kext su macOS con Xcode
    runs-on: macos-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
    - name: Checkout del codice sorgente (Tuo Fork)
      uses: actions/checkout@v4
      with:
        path: 'mio_satellite'

    - name: Scarica il Framework Principale VoodooI2C
      run: |
        git clone --depth=1 --branch 2.9.1 --recurse-submodules "https://github.com/VoodooI2C/VoodooI2C.git" voodoo_main

    - name: Configura Xcode
      run: |
        sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
        xcodebuild -version

    - name: Innesto Codice Modificato
      run: |
        # Le correzioni (didTerminate, Rev 9) sono gia' nei sorgenti del fork: nessuna patch al volo.
        rm -rf voodoo_main/Satellites/VoodooI2CHID
        cp -R mio_satellite voodoo_main/Satellites/VoodooI2CHID
        echo ">>> Sorgenti Rev 9 innestati"

    - name: Compilazione Totale del Workspace
      run: |
        cd voodoo_main
        xcodebuild -workspace VoodooI2C.xcworkspace -scheme "VoodooI2C" -configuration Release -derivedDataPath build/ ARCHS=x86_64 ONLY_ACTIVE_ARCH=NO RUN_CLANG_STATIC_ANALYZER=NO

    - name: Archiviazione e Caricamento dei Kext Pronti
      uses: actions/upload-artifact@v4
      with:
        name: VoodooI2C-XPS9560-Tutti-i-Kext
        path: voodoo_main/build/Build/Products/Release/*.kext
