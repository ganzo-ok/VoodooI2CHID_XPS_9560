name: Compila VoodooI2C con Fix

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kexts su macOS con Xcode
    runs-on: macos-latest
    env:
      # Risolve il warning sui server GitHub forzando la compatibilità delle vecchie azioni
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
    - name: Checkout del codice sorgente
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        fetch-depth: 1

    - name: Configura Xcode
      run: |
        sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
        xcodebuild -version

    - name: Applicazione della correzione (Fix didTerminate)
      run: |
        cd Satellites/VoodooI2CHID
        
        # Inserisce la dicitura di didTerminate prima della chiusura della classe in VoodooI2CHIDDevice.hpp
        sed -i '' '/bool open(IOService \*forClient/i \
            bool didTerminate(IOService* provider, IOOptionBits options, bool* defer) override; \
        ' VoodooI2CHIDDevice.hpp

        # Inserisce l'implementazione della funzione didTerminate in VoodooI2CHIDDevice.cpp
        cat << 'EOF' >> VoodooI2CHIDDevice.cpp

        bool VoodooI2CHIDDevice::didTerminate(IOService* provider, IOOptionBits options, bool* defer) {
            return IOService::didTerminate(provider, options, defer);
        }
        EOF

        echo ">>> Patch applicata con successo ai sorgenti di VoodooI2CHID!"

    - name: Pre-configurazione e Compilazione dei Kext
      run: |
        # Genera le dipendenze e compila i target principali e i satelliti associati nel Workspace
        xcodebuild -workspace VoodooI2C.xcworkspace -scheme "VoodooI2C" -configuration Release -derivedDataPath build/ ARCHS=x86_64 ONLY_ACTIVE_ARCH=NO RUN_CLANG_STATIC_ANALYZER=NO

    - name: Archiviazione e Caricamento dei Kext Pronti
      uses: actions/upload-artifact@v4
      with:
        name: VoodooI2C-Modificato-Kexts
        path: build/Build/Products/Release/*.kext
