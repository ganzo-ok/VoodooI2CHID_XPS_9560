name: Compila VoodooI2CHID XPS 9560

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kext su macOS con Xcode
    runs-on: macos-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
    - name: Checkout del codice sorgente (Tuo Fork)
      uses: actions/checkout@v4
      with:
        path: 'mio_satellite'

    - name: Scarica il Framework Principale VoodooI2C
      run: |
        git clone --depth=1 --recurse-submodules https://github.com voodoo_main

    - name: Configura Xcode
      run: |
        sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
        xcodebuild -version

    - name: Innesto Codice Modificato e Patch
      run: |
        # Sostituisce il satellite originale di VoodooI2C con i tuoi file specifici per XPS 9560
        rm -rf voodoo_main/Satellites/VoodooI2CHID
        cp -R mio_satellite voodoo_main/Satellites/VoodooI2CHID
        
        cd voodoo_main/Satellites/VoodooI2CHID
        
        # Applica la patch didTerminate di sicurezza per evitare il panic allo spegnimento
        sed -i '' '/bool open(IOService \*forClient/i \
            bool didTerminate(IOService* provider, IOOptionBits options, bool* defer) override; \
        ' VoodooI2CHIDDevice.hpp

        cat << 'EOF' >> VoodooI2CHIDDevice.cpp

        bool VoodooI2CHIDDevice::didTerminate(IOService* provider, IOOptionBits options, bool* defer) {
            return IOService::didTerminate(provider, options, defer);
        }
        EOF
        echo ">>> File innestati e patchati con successo nel workspace principale!"

    - name: Compilazione Totale del Workspace
      run: |
        cd voodoo_main
        # Compila l'intero workspace includendo tutte le dipendenze e i driver necessari
        xcodebuild -workspace VoodooI2C.xcworkspace -scheme "VoodooI2C" -configuration Release -derivedDataPath build/ ARCHS=x86_64 ONLY_ACTIVE_ARCH=NO RUN_CLANG_STATIC_ANALYZER=NO

    - name: Archiviazione e Caricamento dei Kext Pronti
      uses: actions/upload-artifact@v4
      with:
        name: VoodooI2C-XPS9560-Tutti-i-Kext
        path: voodoo_main/build/Build/Products/Release/*.kext
